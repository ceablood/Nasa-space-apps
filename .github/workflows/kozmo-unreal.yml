# KOZMOGENİS Unreal Engine 5 paketleme — YALNIZCA elle başlatılır ve UE 5.4 kurulu bir Windows makinesi gerektirir.
# Bu makine GitHub'a "self-hosted runner" olarak etiketlerle bağlanmalıdır: self-hosted, windows, unreal
# (kurulum: kozmogenis/docs/UNREAL_KURULUM.md). Böyle bir makine yokken iş kuyrukta bekler, hiçbir şey üretmez.
name: KOZMOGENİS Unreal paketleme

on:
  workflow_dispatch:
    inputs:
      ue_root:
        description: "Unreal Engine kurulum klasörü"
        default: 'C:\Program Files\Epic Games\UE_5.4'
        required: true

permissions:
  contents: write

jobs:
  package-win64:
    runs-on: [self-hosted, windows, unreal]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Çekirdek testleri (MSVC)
        shell: pwsh
        run: |
          cmake -S kozmogenis -B build-core
          cmake --build build-core --config Release --parallel
          ctest --test-dir build-core -C Release --output-on-failure
      - name: Derle, pişir, paketle (Win64 Shipping)
        shell: pwsh
        run: |
          $uat = Join-Path "${{ inputs.ue_root }}" "Engine\Build\BatchFiles\RunUAT.bat"
          $proj = Join-Path $PWD "kozmogenis\unreal\Kozmogenis\Kozmogenis.uproject"
          & $uat BuildCookRun -project="$proj" -platform=Win64 -clientconfig=Shipping -build -cook -stage -pak -archive -archivedirectory="$PWD\dist" -noP4 -utf8output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\Windows\* -DestinationPath KOZMOGENIS-Win64.zip -Force
      - name: GitHub Release'e yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kozmogenis-${{ github.run_number }}
          name: KOZMOGENİS (Unreal) Win64 — derleme ${{ github.run_number }}
          files: KOZMOGENIS-Win64.zip
