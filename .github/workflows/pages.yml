# KOZMOGENİS web sürümünü GitHub Pages'te yayınlar.
#  /     -> AETHER-X ana oyunu (Python/pygame, pygbag ile WebAssembly; özel NASA yükleme sayfası web/loader/aetherx.tmpl)
# Bir kez: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions" seçilmeli.
name: Web sürümünü yayınla (GitHub Pages)

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pygbag kur
        run: python -m pip install pygbag==0.9.3
      - name: Oyunu derle (pygbag)
        run: |
          mkdir -p web_src/aetherx-x
          cp -r main.py aetherx web_src/aetherx-x/
          find web_src -name __pycache__ -prune -exec rm -rf {} +
          python -m pygbag --build --title AETHER-X --app_name aetherx --template web/loader/aetherx.tmpl web_src/aetherx-x
      - name: Site klasörünü birleştir
        run: |
          cp -r web_src/aetherx-x/build/web _site
          cp -r web/loader/nasa _site/nasa        # yükleme sayfasındaki NASA gezegen haritaları (küçük)
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
